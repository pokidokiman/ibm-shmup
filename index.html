<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBM SHMUP</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(120% 100% at 50% 0%, #241a10 0%, #120d08 45%, #070503 100%);
    color: #ffd9a0;
    font-family: ui-monospace, SFMono-Regular, "Courier New", monospace;
  }
  /* Warm CRT bezel: shell, inner shadow, subtle highlights. */
  .crt-bezel {
    background: linear-gradient(160deg, #6b5636 0%, #463723 38%, #2c2115 70%, #17110b 100%);
    box-shadow:
      0 40px 90px rgba(0, 0, 0, 0.85),
      0 0 0 2px rgba(255, 206, 140, 0.10) inset,
      0 -30px 60px rgba(0, 0, 0, 0.55) inset,
      0 2px 0 rgba(255, 224, 178, 0.22) inset;
  }
  .crt-screen {
    background: #050703;
    box-shadow:
      0 0 60px rgba(0, 0, 0, 0.95) inset,
      0 0 0 3px #0b0805,
      0 0 0 6px rgba(255, 190, 110, 0.10);
  }
  /* Scanlines: 1px dark line every 3px plus a faint travel flicker. */
  .crt-scanlines {
    background-image: repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0) 0px,
      rgba(0, 0, 0, 0) 2px,
      rgba(0, 0, 0, 0.32) 3px
    );
    mix-blend-mode: multiply;
    opacity: 0.85;
  }
  /* Vignette: darkened corners and edges. */
  .crt-vignette {
    background: radial-gradient(120% 120% at 50% 50%, rgba(0, 0, 0, 0) 52%, rgba(0, 0, 0, 0.55) 82%, rgba(0, 0, 0, 0.9) 100%);
  }
  /* Glass: a soft diagonal sheen across the tube. */
  .crt-glass {
    background: linear-gradient(118deg, rgba(255, 240, 210, 0.10) 0%, rgba(255, 240, 210, 0.02) 26%, rgba(255, 255, 255, 0) 46%, rgba(255, 255, 255, 0) 100%);
  }
  .bezel-engrave {
    text-shadow: 0 1px 0 rgba(0, 0, 0, 0.85), 0 -1px 0 rgba(255, 220, 170, 0.14);
  }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8 select-none">

  <main class="w-full max-w-5xl">
    <!-- Chassis -->
    <div class="crt-bezel rounded-[2rem] p-4 sm:p-6 border border-amber-950/60">

      <!-- Screen well -->
      <div class="crt-screen relative rounded-2xl overflow-hidden mx-auto" style="aspect-ratio: 4 / 3;">
        <!-- 4:3 playfield letterboxed inside the warm tube -->
        <canvas id="game-canvas" class="absolute inset-0 block h-full w-full"></canvas>

        <!-- HUD mount (populated by src/render/hud.mjs) -->
        <div id="hud" class="pointer-events-none absolute inset-0 z-20"></div>

        <!-- CRT overlays -->
        <div class="crt-scanlines pointer-events-none absolute inset-0 z-30"></div>
        <div class="crt-vignette pointer-events-none absolute inset-0 z-30"></div>
        <div class="crt-glass pointer-events-none absolute inset-0 z-30"></div>
      </div>

      <!-- Bezel status strip: the engraved readouts -->
      <div class="mt-4 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 text-[10px] uppercase tracking-[0.2em]">
        <div class="bezel-engrave rounded-lg bg-black/30 px-3 py-2 text-amber-200/80">
          <div class="text-amber-500/70">score</div>
          <div id="score" class="tabular-nums text-amber-100">000000000</div>
        </div>
        <div class="bezel-engrave rounded-lg bg-black/30 px-3 py-2 text-amber-200/80">
          <div class="text-amber-500/70">lives</div>
          <div id="lives" class="tabular-nums text-amber-100">3</div>
        </div>
        <div class="bezel-engrave rounded-lg bg-black/30 px-3 py-2 text-amber-200/80">
          <div class="text-amber-500/70">bombs</div>
          <div id="bombs" class="tabular-nums text-amber-100">3</div>
        </div>
        <div class="bezel-engrave rounded-lg bg-black/30 px-3 py-2 text-amber-200/80">
          <div class="text-amber-500/70">power</div>
          <div id="power" class="tabular-nums text-amber-100">1</div>
        </div>
        <div class="bezel-engrave rounded-lg bg-black/30 px-3 py-2 text-amber-200/80">
          <div class="text-amber-500/70">chain</div>
          <div id="chain" class="tabular-nums text-amber-100">0</div>
        </div>
        <div class="bezel-engrave col-span-2 sm:col-span-1 lg:col-span-1 rounded-lg bg-black/30 px-3 py-2 text-amber-200/80">
          <div class="text-amber-500/70">boss</div>
          <div id="boss" class="mt-1 h-2 w-full overflow-hidden rounded-full bg-black/60 ring-1 ring-amber-900/50">
            <div id="boss-fill" class="h-full w-0 bg-gradient-to-r from-amber-500 via-rose-400 to-fuchsia-400 transition-[width] duration-150"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { createScene } from './src/render/three-scene.mjs';
    import { createHUD } from './src/render/hud.mjs';
    import { createGame } from './src/game/game.mjs';
    import { loadAssets } from './src/render/assets.mjs';

    const SEED = 0x1badb002;
    const STAGE = 1;
    const FIXED_STEP = 1 / 120;   // fixed-timestep simulation cadence
    const MAX_FRAME = 0.25;       // clamp a stalled tab so the loop cannot spiral

    const canvas = document.getElementById('game-canvas');
    let game = createGame({ seed: SEED, stage: STAGE });
    // Retry bookkeeping: a run counter gives each retry its own deterministic seed,
    // and `retryArmed` forces a fresh trigger press so dying with fire held cannot
    // skip straight past the GAME OVER screen.
    let run = 0;
    let retryArmed = false;
    // Stream the shipped PNG art before the scene exists: `loadAssets()` resolves
    // to `{ file -> THREE.Texture }` and never rejects (a missing PNG is simply
    // absent), so the atlas can hold the registry from its very first frame.
    const assets = await loadAssets();
    const scene = createScene({ canvas, stage: STAGE, seed: SEED, assets });
    // Exposed for the runtime probe (tools/smoke.mjs): lets a test read three's own render
    // stats and the batch contents, which is the only way to tell a black playfield's cause apart.
    globalThis.__shmup = { game: null, scene: null, hud: null };

    const hud = createHUD({ root: document.getElementById('hud'), chainTimeout: 120 });

    /* ------------------------------------------------------------- input ---- */

    const KEY_ACTIONS = {
      ArrowLeft: 'left', KeyA: 'left',
      ArrowRight: 'right', KeyD: 'right',
      ArrowUp: 'up', KeyW: 'up',
      ArrowDown: 'down', KeyS: 'down',
      KeyZ: 'fire', Space: 'fire',
      KeyX: 'bomb',
      ShiftLeft: 'focus', ShiftRight: 'focus',
    };

    const onKey = (ev, down) => {
      const action = KEY_ACTIONS[ev.code];
      if (!action) return;
      ev.preventDefault();
      game.input[action] = down;
    };
    addEventListener('keydown', (ev) => onKey(ev, true));
    addEventListener('keyup', (ev) => onKey(ev, false));
    addEventListener('blur', () => {
      game.input.up = game.input.down = game.input.left = game.input.right = false;
      game.input.fire = game.input.bomb = game.input.focus = false;
    });

    /* ------------------------------------------------------ world -> sprites -- */

    const ENEMY_SPRITE = {
      popcorn: 'enemyPopcorn',
      grunt: 'enemyGrunt',
      turret: 'enemyTurret',
      heavy: 'enemyTurret',
      midboss: 'enemyMidboss',
      boss: 'bossCore',
    };
    const BULLET_SPRITE = {
      pellet: 'bulletOrb',
      orb: 'bulletOrb',
      dart: 'bulletShell',
      shell: 'bulletShell',
      wave: 'bulletWave',
      star: 'star',
      laser: 'laser',
      shot: 'shot',
    };
    const PICKUP_SPRITE = { power: 'powerPow', life: 'powerLife', bomb: 'powerBomb', score: 'powerScore' };

    function buildFrame() {
      const { actors, fx } = scene.batches;
      actors.begin();
      fx.begin();

      // Player (blinks while invulnerable).
      const blink = game.player.invuln > 0 && (game.state.frame % 8) < 4 ? 0.35 : 1;
      actors.push('player', game.player.x, game.player.y, { alpha: blink });

      // Enemies.
      for (const e of game.enemies) {
        if (!e.active) continue;
        const name = ENEMY_SPRITE[e.kind] || 'enemyPopcorn';
        actors.push(name, e.x, e.y, { alpha: e.flash > 0 ? 0.6 : 1, tint: e.flash > 0 ? '#ffffff' : undefined });
      }

      // Boss.
      if (game.boss && game.boss.active) {
        actors.push('bossCore', game.boss.x, game.boss.y, { alpha: game.boss.flash > 0 ? 0.7 : 1 });
      }

      // Bullets: friendly in the actor layer, danmaku in the additive fx layer.
      for (const b of game.bullets.active) {
        const name = BULLET_SPRITE[b.kind] || (b.friendly ? 'shot' : 'bulletOrb');
        if (b.friendly) actors.push(name, b.x, b.y);
        else if (b.laser) fx.pushSized('laser', b.x, b.y, Math.max(2, b.width || 8), Math.max(2, b.length || 8), { rot: b.angle });
        else fx.push(name, b.x, b.y);
      }

      // Pickups.
      for (const p of game.pickups) actors.push(PICKUP_SPRITE[p.kind] || 'powerScore', p.x, p.y);

      actors.end();
      fx.end();
    }

    /* -------------------------------------------------------- bezel readouts -- */

    const els = {
      score: document.getElementById('score'),
      lives: document.getElementById('lives'),
      bombs: document.getElementById('bombs'),
      power: document.getElementById('power'),
      chain: document.getElementById('chain'),
      bossFill: document.getElementById('boss-fill'),
    };

    function paintBezel() {
      const s = game.state;
      els.score.textContent = String(Math.max(0, Math.floor(s.score))).padStart(9, '0');
      els.lives.textContent = String(Math.max(0, Math.floor(s.lives)));
      els.bombs.textContent = String(Math.max(0, Math.floor(s.bombs)));
      els.power.textContent = String(Math.max(1, Math.floor(s.power)));
      els.chain.textContent = String(Math.max(0, Math.floor(s.chain)));
      const boss = game.boss;
      const ratio = boss && boss.active ? Math.max(0, Math.min(1, boss.hp / Math.max(1, boss.maxHp))) : 0;
      els.bossFill.style.width = `${(ratio * 100).toFixed(1)}%`;
    }

    /* ------------------------------------------------------------- main loop -- */

    let accumulator = 0;
    let last = performance.now();

    // A single throwing frame must never take the loop down with it: report each
    // distinct fault once (a broken frame would otherwise flood the console) and
    // let the very next rAF tick try again.
    const reported = new Set();
    function reportFrameError(where, err) {
      const key = `${where}: ${err && err.message ? err.message : String(err)}`;
      if (reported.has(key)) return;
      reported.add(key);
      console.error(`[ibm-shmup] ${where} threw`, err);
    }

    globalThis.__shmup.game = game;
    globalThis.__shmup.scene = scene;
    globalThis.__shmup.hud = hud;

    function frame(now) {
      const elapsed = Math.min(Math.max((now - last) / 1000, 0), MAX_FRAME);
      last = now;

      try {
        // Fixed timestep: drain the accumulator in 1/120 s simulation steps. A
        // fault in the simulation must not cost us the frame — the renderer below
        // still runs, so the playfield keeps being painted.
        try {
          accumulator += elapsed;
          while (accumulator >= FIXED_STEP) {
            game.step(FIXED_STEP);
            accumulator -= FIXED_STEP;
          }
        } catch (err) {
          accumulator = 0;
          reportFrameError('simulation', err);
        }

        // Retry. The HUD promises it ("press fire to retry") but nothing ever reset
        // the run, so game over was a dead end. A fresh game object is the cleanest
        // reset: no stale enemies, bullets, pickups or chain can survive it.
        if (game.state.gameOver) {
          if (!game.input.fire) {
            retryArmed = true;
          } else if (retryArmed) {
            run += 1;
            game = createGame({ seed: SEED + run, stage: STAGE });
            globalThis.__shmup.game = game;
            scene.setProgress(0);
            accumulator = 0;
            retryArmed = false;
          }
        } else {
          retryArmed = false;
        }

        // Stage progress drives the parallax scroll, then the sprite batches are
        // rebuilt from live game state and composited through the CRT pass.
        scene.setProgress(game.state.progress);
        buildFrame();
        scene.draw(elapsed);

        // HUD overlays and the engraved bezel readouts.
        hud.update(game.state, { boss: game.boss, dt: elapsed });
        hud.drain(game.events);
        paintBezel();
      } catch (err) {
        reportFrameError('frame', err);
      } finally {
        // Continuation: the next frame is queued whatever happened above, so the
        // loop survives a bad frame and keeps drawing every frame.
        game.events.length = 0;
        requestAnimationFrame(frame);
      }
    }

    paintBezel();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
